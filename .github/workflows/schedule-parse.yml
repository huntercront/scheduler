name: Parse scheduler
"on":
  schedule:
    - cron: 15 * * * *
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: parse-schedule
  cancel-in-progress: true
jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run parser
        run: node parse.js
      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain schedule.json)" ]]; then
            git add schedule.json
            git commit -m "chore: update schedule $(date -u +%FT%TZ)"
            git push
          else
            echo "Нет изменений — пропускаем коммит"
          fi
